# Builds FastMACE's sdist and wheel from a ref and checks them with twine. Manual only; it never publishes
# (no PyPI token, no upload step; docs/development.md, "Releasing"). Hosted CI stays off otherwise (owner D7).
name: release-build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (for example v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build --sdist --wheel --outdir dist .
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: fastmace-dist
          path: dist/
          retention-days: 14
