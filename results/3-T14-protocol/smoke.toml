# 3-T14 GPU smoke: swap_anneal_NaNbOCl4 with a 5.5 ps schedule (0 -> 1000 K in 0.5 ps, then 150 K/ps
# to 250 K), every stage and setting otherwise as shipped. The structure path is filled in by run.sh.

model = "mh1"
head = "matpes_r2scan"
repeat = [3, 3, 3]
timestep_fs = 1.0
min_mc_temperature_K = 250.0

[[schedule]]
kind = "ramp"
start_K = 0.0
end_K = 1000.0
ps = 0.5

[[schedule]]
kind = "ramp"
start_K = 1000.0
end_K = 250.0
rate_K_per_ps = -150.0

[engine]
backend = "hybrid"

[output]
trajectory_every = 10
thermo_every = 10
restart_every = 10000

[[mc]]
move = "swap"
pairs = [["O", "Cl"]]
every = 100
attempts = 50
velocities = "exchange"

[relax]
fmax = 0.01
optimizer = "LBFGS"
max_steps = 5000

[quench]
min_K = 500.0
bin_K = 100.0
per_bin = 2
fmax = 0.01
optimizer = "LBFGS"
max_steps = 5000
