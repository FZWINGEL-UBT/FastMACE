# 5-T11 (runbook item 6): the NVT anneal on NaCl 3x3x3 from main.py's --profile anneal (heat_ps 20, peak 1000 K,
# then 3 K/ps to final 250 K, samples and frames every 10 fs, relax fmax 0.01). Not a shipped profile.
structure = "/home/fzwin/fastmace-acceptance/5-T11-local-20261025-recovery-adapt-production/adapt-production/nacl-config/NaCl_conventional.cif"
model = "mh1"
head = "matpes_r2scan"
repeat = [3, 3, 3]
timestep_fs = 1.0
ensemble = "NVT"

[[schedule]]
kind = "ramp"
start_K = 0.0
end_K = 1000.0
ps = 20.0

[[schedule]]
kind = "ramp"
start_K = 1000.0
end_K = 250.0
rate_K_per_ps = -3.0

[engine]
backend = "hybrid"

[output]
trajectory_every = 10
thermo_every = 10
restart_every = 10000

[relax]
fmax = 0.01
optimizer = "gpu-LBFGS"
max_steps = 5000
