# The NPT melt-quench protocol of npt_anneal_NbCl5.toml with a schedule a tenth as long: 0 -> 1000 K in
# 2 ps, then 30 K/ps to 250 K (27,000 steps at 1 fs). Every stage and setting is the same. It is the
# smoke run, not a production protocol.

structure = "NbCl5_R2SCAN.cif"
model = "mh1"
head = "matpes_r2scan"
dispersion = "d3bj"
repeat = [3, 3, 3]
timestep_fs = 1.0
ensemble = "NPT"
pressure_GPa = 0.0
cell_mode = "hydrostatic"

[[schedule]]
kind = "ramp"
start_K = 0.0
end_K = 1000.0
ps = 2.0

[[schedule]]
kind = "ramp"
start_K = 1000.0
end_K = 250.0
rate_K_per_ps = -30.0

[engine]
backend = "hybrid"

[output]
trajectory_every = 100
thermo_every = 10
restart_every = 10000

[relax]
fmax = 0.01
optimizer = "gpu-LBFGS"
max_steps = 5000

[quench]
min_K = 500.0
bin_K = 100.0
per_bin = 2
fmax = 0.01
optimizer = "gpu-LBFGS"
max_steps = 5000
